<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>352 H301 · 家庭空气控制台</title>
<style>
  /* ── 基础与主题 ── */
  :root {
    --accent: #0a84ff;
    --accent2: #22d3ee;
    --ok: #30d158;
    --warn: #ff9f0a;
    --bad: #ff453a;
    --r: 18px;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    --mono: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
    --shadow: 0 10px 32px rgba(0,0,0,.10);
  }
  [data-theme="dark"] {
    --accent: #0a84ff;
    --accent2: #38e0ff;
    --txt: #f5f5f7;
    --txt2: #a9a9ae;
    --txt3: #6e6e73;
    --bg: #0b0d12;
    --card: #14171e;
    --card2: #1a1e28;
    --line: rgba(255,255,255,.09);
    --chip: rgba(255,255,255,.07);
    --shadow: 0 12px 36px rgba(0,0,0,.45);
    --glow: rgba(56,224,255,.28);
  }
  [data-theme="light"] {
    --txt: #1d1d1f;
    --txt2: #6e6e73;
    --txt3: #aeaeb2;
    --bg: #f2f2f4;
    --card: #ffffff;
    --card2: #f7f7f9;
    --line: rgba(0,0,0,.08);
    --chip: rgba(0,0,0,.05);
    --glow: rgba(10,132,255,.18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--txt);
    overflow: hidden;
    transition: background .5s ease, color .5s ease;
    -webkit-font-smoothing: antialiased;
  }

  /* ── 登录门 ── */
  .login-gate {
    position: fixed; inset: 0; z-index: 300;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    transition: opacity .45s ease, visibility .45s ease;
  }
  .login-gate.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .login-card {
    width: min(380px, 92vw);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow: var(--shadow);
    padding: 38px 34px 32px;
    display: flex; flex-direction: column; gap: 15px;
  }
  .login-card .logo {
    width: 58px; height: 58px; border-radius: 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 6px;
    box-shadow: 0 10px 28px var(--glow);
  }
  .login-card .logo svg { width: 30px; height: 30px; }
  .login-card h1 {
    text-align: center; font-size: 21px; font-weight: 700;
    letter-spacing: -.2px;
  }
  .login-card .sub {
    text-align: center; font-size: 12.5px; color: var(--txt3);
    margin-top: -8px; margin-bottom: 6px;
  }
  .login-card label { font-size: 11.5px; color: var(--txt3); font-weight: 550; letter-spacing: .35px; }
  .login-card input {
    width: 100%; padding: 12px 14px;
    border-radius: 12px; border: 1px solid var(--line);
    background: var(--card2); color: var(--txt);
    font-size: 14.5px; outline: none;
    transition: border .2s, box-shadow .2s;
  }
  .login-card input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
  .login-card .row { display: flex; flex-direction: column; gap: 6px; }
  .login-btn {
    margin-top: 8px; padding: 13px;
    border-radius: 12px; border: none;
    background: var(--accent); color: #fff;
    font-size: 15px; font-weight: 650; cursor: pointer;
    box-shadow: 0 8px 22px rgba(10,132,255,.3);
    transition: all .2s;
  }
  .login-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .login-btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }
  .login-err {
    font-size: 12.5px; color: var(--bad); text-align: center;
    min-height: 16px;
  }

  /* ── 单屏网格布局: 空气质量 | 设备控制 | 自动化设置 ── */
  .app {
    height: 100dvh;
    display: grid;
    grid-template-rows: 52px 1fr 38px;
    grid-template-columns: 1fr 380px 368px;
    grid-template-areas:
      "head head head"
      "aqi device settings"
      "foot foot foot";
    gap: 12px;
    padding: 12px 16px;
    max-width: 1560px;
    margin: 0 auto;
  }
  @media (max-width: 1180px) {
    body { overflow: auto; }
    .app {
      height: auto; min-height: 100dvh;
      grid-template-columns: 1fr 1fr;
      grid-template-areas:
        "head head"
        "aqi device"
        "settings settings"
        "foot foot";
    }
  }
  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; grid-template-areas: "head" "aqi" "device" "settings" "foot"; }
  }

  /* ── 顶栏 ── */
  .head {
    grid-area: head;
    display: flex; align-items: center; gap: 14px;
    padding: 0 6px;
  }
  .head .model {
    font-size: 15px; font-weight: 600; letter-spacing: .2px;
  }
  .head .model small {
    display: block; font-size: 10.5px; font-weight: 500;
    color: var(--txt3); letter-spacing: .4px;
    font-family: var(--mono);
  }
  .head .sp { flex: 1; }

  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 6px 13px; border-radius: 999px;
    background: var(--chip); border: 1px solid var(--line);
    font-size: 12.5px; font-weight: 550; color: var(--txt2);
    white-space: nowrap;
  }
  .pill .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--txt3);
  }
  .pill.on  .dot { background: var(--ok); box-shadow: 0 0 8px var(--ok); animation: pulse 2.2s ease-in-out infinite; }
  .pill.off .dot { background: var(--txt3); }
  .pill.run .dot { background: var(--accent2); box-shadow: 0 0 8px var(--accent2); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }

  .icon-btn {
    height: 34px; padding: 0 12px; border-radius: 10px;
    background: var(--chip); border: 1px solid var(--line);
    color: var(--txt2); font-size: 12px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    transition: all .2s; font-weight: 550;
  }
  .icon-btn:hover { color: var(--txt); border-color: var(--accent); box-shadow: 0 0 12px var(--glow); }
  .icon-btn.sq { width: 34px; padding: 0; font-size: 15px; }

  /* ── 面板通用 ── */
  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r);
    box-shadow: var(--shadow);
    overflow: hidden;
    display: flex; flex-direction: column;
    min-height: 0;
    transition: background .5s ease, border-color .5s ease;
  }

  /* ── 空气质量面板 (左) ── */
  .aqi { grid-area: aqi; }
  .aqi .inner {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 18px 22px; gap: 6px; min-height: 0;
  }
  .aqi .src {
    font-size: 11px; color: var(--txt3); font-family: var(--mono);
    letter-spacing: .5px; text-transform: uppercase;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center;
  }
  .aqi .src b { color: var(--accent2); font-weight: 600; }
  .aqi .big {
    font-size: clamp(110px, 17vh, 190px);
    font-weight: 720; letter-spacing: -.045em; line-height: .95;
    font-variant-numeric: tabular-nums;
    transition: color .5s ease;
  }
  .aqi .grade {
    display: inline-flex; padding: 5px 16px; border-radius: 999px;
    font-size: 13px; font-weight: 650; letter-spacing: .5px;
    border: 1px solid var(--line);
  }
  .aqi .pm {
    font-size: 13.5px; color: var(--txt2); margin-top: 6px;
    font-family: var(--mono);
  }
  .aqi .pm b { color: var(--txt); font-weight: 650; }

  /* 色阶条 */
  .scale {
    width: min(460px, 92%); margin-top: 26px;
  }
  .scale .bar {
    position: relative; height: 8px; border-radius: 999px;
    background: linear-gradient(90deg, #30d158 0%, #ffd60a 22%, #ff9f0a 42%, #ff453a 62%, #bf5af2 80%, #8e3061 100%);
  }
  .scale .mk {
    position: absolute; top: 50%; width: 15px; height: 15px;
    border-radius: 50%; background: #fff; border: 3px solid var(--txt);
    transform: translate(-50%, -50%);
    box-shadow: 0 2px 10px rgba(0,0,0,.35);
    transition: left .8s cubic-bezier(.22,1,.36,1);
  }
  .scale .ticks {
    display: flex; justify-content: space-between;
    margin-top: 8px; font-size: 10px; color: var(--txt3);
    font-family: var(--mono);
  }

  /* ── 设备面板 (中) ── */
  .device { grid-area: device; }
  .device .photo-wrap {
    position: relative;
    flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 14px 14px 4px;
    overflow: hidden;
  }
  .device .halo {
    position: absolute; width: 240px; height: 240px; border-radius: 50%;
    background: radial-gradient(circle, var(--glow) 0%, transparent 68%);
    top: 42%; left: 50%; transform: translate(-50%, -50%);
    opacity: 0; transition: opacity .8s ease; pointer-events: none;
  }
  .device.is-on .halo { opacity: 1; animation: breathe 3.2s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: translate(-50%, -50%) scale(1.12); opacity: .75; } }
  .device .photo {
    position: relative; z-index: 1;
    height: 100%; max-height: 340px; width: auto; max-width: 100%;
    object-fit: contain;
    filter: drop-shadow(0 18px 28px rgba(0,0,0,.18));
    transition: filter .6s ease, transform .6s ease;
  }
  .device.is-off .photo { filter: drop-shadow(0 12px 20px rgba(0,0,0,.14)) saturate(.82) brightness(.97); }
  .device.is-on  .photo { transform: translateY(-3px); }

  /* 出风动效 */
  .airflow {
    position: absolute; top: 6%; left: 50%; transform: translateX(-50%);
    width: 130px; height: 74px; z-index: 2; pointer-events: none;
    opacity: 0; transition: opacity .7s ease;
  }
  .device.is-on .airflow { opacity: 1; }
  .airflow span {
    position: absolute; width: 2px; height: 26px; border-radius: 2px;
    background: linear-gradient(to top, transparent, var(--accent2));
    animation: rise 1.9s ease-in-out infinite;
  }
  .airflow span:nth-child(1) { left: 12%; animation-delay: 0s; }
  .airflow span:nth-child(2) { left: 32%; animation-delay: .35s; height: 34px; }
  .airflow span:nth-child(3) { left: 52%; animation-delay: .7s; }
  .airflow span:nth-child(4) { left: 72%; animation-delay: 1.05s; height: 30px; }
  .airflow span:nth-child(5) { left: 88%; animation-delay: 1.4s; }
  @keyframes rise {
    0%   { transform: translateY(14px) scaleY(.4); opacity: 0; }
    35%  { opacity: .95; }
    100% { transform: translateY(-30px) scaleY(1); opacity: 0; }
  }

  .device .ops {
    padding: 10px 16px 14px;
    display: flex; flex-direction: column; gap: 10px;
    border-top: 1px solid var(--line);
    background: var(--card2);
    transition: background .5s ease;
  }
  .power-btn {
    width: 100%; padding: 13px;
    border-radius: 14px; border: 1px solid var(--line);
    background: var(--chip); color: var(--txt);
    font-size: 15px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 9px;
    transition: all .25s ease;
  }
  .power-btn svg { width: 19px; height: 19px; }
  .power-btn.on {
    background: linear-gradient(135deg, rgba(48,209,88,.16), rgba(48,209,88,.06));
    border-color: rgba(48,209,88,.45); color: var(--ok);
    box-shadow: 0 0 22px rgba(48,209,88,.18);
  }
  .power-btn:hover { transform: translateY(-1px); border-color: var(--accent); }
  .power-btn:active { transform: scale(.98); }
  /* 等待态: 请求已接收, 设备响应中 */
  .power-btn.pending {
    cursor: progress;
    border-color: var(--accent2);
    color: var(--accent2);
    background: rgba(56,224,255,.10);
    animation: pendingGlow 1.1s ease-in-out infinite;
    pointer-events: none;
  }
  .power-btn.pending svg { animation: spin 1s linear infinite; }
  @keyframes pendingGlow {
    50% { box-shadow: 0 0 26px var(--glow); background: rgba(56,224,255,.18); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .mgrid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .m {
    background: var(--chip); border: 1px solid var(--line);
    border-radius: 11px; padding: 8px 6px; text-align: center;
  }
  .m .v { font-size: 15px; font-weight: 650; font-family: var(--mono); letter-spacing: -.2px; }
  .m .k { font-size: 10px; color: var(--txt3); margin-top: 3px; letter-spacing: .3px; }

  /* ── 自动化设置面板 (右) ── */
  .settings { grid-area: settings; overflow: hidden; }
  .settings .head2 {
    padding: 13px 18px 11px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
  }
  .settings .head2 h2 { font-size: 14px; font-weight: 650; letter-spacing: .2px; }
  .settings .body {
    flex: 1; overflow-y: auto; padding: 13px 18px 16px;
    display: flex; flex-direction: column; gap: 11px;
    scrollbar-width: thin; scrollbar-color: var(--line) transparent;
  }
  .frow { display: flex; flex-direction: column; gap: 5px; }
  .frow label { font-size: 11px; color: var(--txt3); letter-spacing: .35px; font-weight: 550; }
  .frow .inline { display: flex; gap: 8px; }
  .frow .inline > * { flex: 1; min-width: 0; }

  .inp, .sel {
    width: 100%; padding: 9px 12px;
    border-radius: 11px; border: 1px solid var(--line);
    background: var(--card2); color: var(--txt);
    font-size: 13.5px; font-family: var(--font);
    outline: none; transition: border .2s, box-shadow .2s;
  }
  .inp:focus, .sel:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
  .sel { cursor: pointer; appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--txt3) 50%), linear-gradient(135deg, var(--txt3) 50%, transparent 50%);
    background-position: calc(100% - 17px) 55%, calc(100% - 12px) 55%;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    padding-right: 30px;
  }
  .sel:disabled { opacity: .55; cursor: wait; }

  /* 监测站加载提示 */
  .st-hint {
    font-size: 10.5px; color: var(--txt3); letter-spacing: .3px;
    min-height: 14px; display: flex; align-items: center; gap: 6px;
    margin-top: -4px;
  }
  .st-hint.busy { color: var(--accent2); animation: pulse 1.2s ease-in-out infinite; }
  .st-hint.err { color: var(--bad); }

  .btn {
    padding: 9px 14px; border-radius: 11px;
    border: 1px solid var(--line); background: var(--chip);
    color: var(--txt); font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all .2s; white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); box-shadow: 0 0 14px var(--glow); }
  .btn.primary {
    background: var(--accent); border-color: var(--accent); color: #fff;
    box-shadow: 0 6px 18px rgba(10,132,255,.28);
  }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.sm { padding: 7px 10px; font-size: 12px; }

  /* 开关 */
  .switch {
    position: relative; width: 42px; height: 24px; flex: none;
    border-radius: 999px; background: var(--chip);
    border: 1px solid var(--line); cursor: pointer;
    transition: background .25s ease;
  }
  .switch::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 18px; height: 18px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.3);
    transition: transform .25s cubic-bezier(.22,1,.36,1);
  }
  .switch.on { background: var(--accent); border-color: var(--accent); }
  .switch.on::after { transform: translateX(18px); }

  /* ── 科技感时间选择器 ── */
  .trow { display: flex; align-items: center; gap: 10px; }
  .trow .lb { width: 52px; font-size: 11px; color: var(--txt3); letter-spacing: .35px; font-weight: 550; flex: none; }
  .tp {
    position: relative; flex: 1;
  }
  .tp-btn {
    width: 100%;
    display: flex; align-items: center; justify-content: center; gap: 2px;
    padding: 9px 10px;
    border-radius: 11px;
    border: 1px solid var(--line);
    background:
      repeating-linear-gradient(0deg, transparent 0 3px, rgba(56,224,255,.025) 3px 4px),
      var(--card2);
    color: var(--accent2);
    font-family: var(--mono); font-size: 19px; font-weight: 650;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all .25s ease;
    text-shadow: 0 0 12px var(--glow);
  }
  .tp-btn:hover, .tp.open .tp-btn {
    border-color: var(--accent2);
    box-shadow: 0 0 0 1px var(--accent2), 0 0 22px var(--glow), inset 0 0 18px rgba(56,224,255,.06);
  }
  .tp-btn .cln {
    animation: blink 1.8s step-end infinite;
    color: var(--accent2); opacity: .85;
  }
  @keyframes blink { 50% { opacity: .15; } }
  .tp-btn:disabled { opacity: .35; cursor: not-allowed; }

  .tp-pop {
    position: absolute; top: calc(100% + 7px); left: 0; right: 0;
    background:
      radial-gradient(circle at 85% -10%, rgba(56,224,255,.10), transparent 55%),
      var(--card);
    border: 1px solid rgba(56,224,255,.35);
    border-radius: 14px;
    box-shadow: 0 18px 48px rgba(0,0,0,.4), 0 0 28px var(--glow);
    z-index: 60; display: none;
    overflow: hidden;
  }
  .tp-pop.open { display: block; animation: popin .18s cubic-bezier(.22,1,.36,1); }
  @keyframes popin { from { opacity: 0; transform: translateY(-7px) scale(.98); } }
  .tp-pop .scan {
    height: 2px; margin: 0;
    background: linear-gradient(90deg, transparent, var(--accent2), transparent);
    opacity: .55;
  }
  .tp-cols { display: flex; gap: 0; padding: 10px 8px 6px; }
  .tp-col {
    flex: 1; height: 152px; overflow-y: auto;
    scroll-snap-type: y mandatory;
    scrollbar-width: none;
    mask-image: linear-gradient(to bottom, transparent, #000 18%, #000 82%, transparent);
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 18%, #000 82%, transparent);
  }
  .tp-col::-webkit-scrollbar { display: none; }
  .tp-col .it {
    scroll-snap-align: center;
    padding: 7px 0; text-align: center;
    font-family: var(--mono); font-size: 17px; font-weight: 600;
    color: var(--txt3); cursor: pointer; border-radius: 8px;
    letter-spacing: 1px;
    transition: all .15s ease;
  }
  .tp-col .it:hover { color: var(--txt2); background: var(--chip); }
  .tp-col .it.sel {
    color: var(--accent2);
    background: rgba(56,224,255,.10);
    text-shadow: 0 0 14px var(--glow);
    border: 1px solid rgba(56,224,255,.3);
    transform: scale(1.05);
  }
  .tp-sep {
    width: 1px; margin: 12px 0;
    background: linear-gradient(to bottom, transparent, var(--accent2), transparent);
    opacity: .35;
  }
  .tp-foot {
    display: flex; gap: 7px; padding: 8px 10px 10px;
    border-top: 1px solid var(--line);
  }
  .tp-foot .btn { flex: 1; padding: 7px 6px; font-size: 12px; }
  .tp-foot .btn.accent {
    background: rgba(56,224,255,.13); border-color: rgba(56,224,255,.4);
    color: var(--accent2);
  }

  /* ── 底部状态条 ── */
  .foot {
    grid-area: foot;
    display: flex; align-items: center; gap: 12px;
    padding: 0 8px; font-size: 11.5px; color: var(--txt3);
    overflow: hidden;
  }
  .foot .log {
    flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    font-family: var(--mono); letter-spacing: .15px;
  }
  .foot .log b { color: var(--accent2); font-weight: 550; }

  /* ── 提示 ── */
  #toast {
    position: fixed; left: 50%; bottom: 54px; transform: translateX(-50%) translateY(12px);
    background: rgba(28,28,30,.92); color: #fff;
    padding: 10px 20px; border-radius: 12px; font-size: 13.5px;
    opacity: 0; pointer-events: none; transition: all .28s ease;
    z-index: 400; backdrop-filter: blur(12px);
    box-shadow: 0 10px 32px rgba(0,0,0,.35);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- ════ 登录门: 352Life 账号密码在此输入 ════ -->
<div class="login-gate" id="loginGate">
  <div class="login-card">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
        <path d="M12 3v9"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/>
      </svg>
    </div>
    <h1>352 H301 空气控制台</h1>
    <div class="sub">请登录 352Life 账号以控制设备</div>
    <div class="row">

/* ══════════ 工具 ══════════ */
const $ = (id) => document.getElementById(id);

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), 2600);
}

async function api(path, opts) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 30000); // 30s 兜底, 防止按钮永久卡在等待态
  try {
    const r = await fetch(path, { ...opts, signal: ctl.signal });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
    if (d.ok === false) throw new Error(d.error || "操作失败"); // 业务失败也视为错误
    return d;
  } catch (e) {
    if (e.name === "AbortError") throw new Error("请求超时(30秒), 请稍后重试");
    throw e;
  } finally {
    clearTimeout(timer);
  }
}

function footLog(line) {
  $("footLog").textContent = line;
}

  if (!account || !password) {
    errEl.textContent = "请输入账号和密码";
    return;
  }
  const btn = $("loginBtn");
  btn.disabled = true;
  btn.textContent = "登录中…";
  try {
    await api("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ account, password }),
    });
    sessionStorage.setItem("air352_auth", "1");
    $("loginGate").classList.add("hidden");
    toast("登录成功");
    initDashboard();
  } catch (e) {
    errEl.textContent = "登录失败：" + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = "登 录";
  }
}

function doLogout() {

/* ══════════ 科技感时间选择器 ══════════ */
class TechTimePicker {
  constructor(root, value, onChange, opts = {}) {
    this.root = root;
    this.onChange = onChange;
    this.opts = opts;   // { optional: bool }
    this.value = value; // "HH:MM" 或 null
    this._build();
    this._render();
  }
  set(v) { this.value = v; this._render(); }
  get() { return this.value; }

  _build() {
    this.root.classList.add("tp");
    this.root.innerHTML = `
      <button class="tp-btn" type="button">
        <span class="hh">--</span><span class="cln">:</span><span class="mm">--</span>
      </button>
      <div class="tp-pop">
        <div class="scan"></div>
        <div class="tp-cols">
          <div class="tp-col tp-h"></div>
          <div class="tp-sep"></div>
          <div class="tp-col tp-m"></div>
        </div>
        <div class="tp-foot">
          <button class="btn" type="button" data-act="now">此刻</button>
          ${this.opts.optional ? '<button class="btn" type="button" data-act="clear">不限</button>' : ""}
          <button class="btn accent" type="button" data-act="ok">确定</button>
        </div>
      </div>`;
    this.btn = this.root.querySelector(".tp-btn");
    this.pop = this.root.querySelector(".tp-pop");
    this.hhEl = this.root.querySelector(".hh");
    this.mmEl = this.root.querySelector(".mm");
    this.hCol = this.root.querySelector(".tp-h");
    this.mCol = this.root.querySelector(".tp-m");

    for (let h = 0; h < 24; h++) {
      const d = document.createElement("div");
      d.className = "it"; d.dataset.v = h;
      d.textContent = String(h).padStart(2, "0");
      this.hCol.appendChild(d);
    }
    for (let m = 0; m < 60; m++) {
      const d = document.createElement("div");
      d.className = "it"; d.dataset.v = m;
      d.textContent = String(m).padStart(2, "0");
      this.mCol.appendChild(d);
    }

    this._tmp = { h: 0, m: 0 };

    this.hCol.addEventListener("click", e => {
      const it = e.target.closest(".it"); if (!it) return;
      this._tmp.h = +it.dataset.v;
      this._mark(); this._scrollTo(this.hCol, it);
    });
    this.mCol.addEventListener("click", e => {
      const it = e.target.closest(".it"); if (!it) return;
      this._tmp.m = +it.dataset.v;
      this._mark(); this._scrollTo(this.mCol, it);
    });

    this.btn.addEventListener("click", e => {
      e.stopPropagation();
      const open = this.pop.classList.contains("open");
      document.querySelectorAll(".tp-pop.open").forEach(p => p.classList.remove("open"));
      document.querySelectorAll(".tp.open").forEach(p => p.classList.remove("open"));
      if (!open) {
        const cur = this.value ? this.value.split(":").map(Number) : [new Date().getHours(), 0];
        this._tmp = { h: cur[0], m: cur[1] };
        this._mark();
        this.pop.classList.add("open");
        this.root.classList.add("open");
        requestAnimationFrame(() => {
          this._scrollTo(this.hCol, this.hCol.querySelector(".sel"), true);
          this._scrollTo(this.mCol, this.mCol.querySelector(".sel"), true);
        });
      }
    });

    this.pop.addEventListener("click", e => {
      e.stopPropagation();
      const act = e.target.closest("[data-act]")?.dataset.act;
      if (act === "ok") {
        this.value = `${String(this._tmp.h).padStart(2, "0")}:${String(this._tmp.m).padStart(2, "0")}`;
        this._render(); this._close(); this.onChange?.(this.value);
      } else if (act === "now") {
        const n = new Date();
        this._tmp = { h: n.getHours(), m: n.getMinutes() };
        this._mark();
        this._scrollTo(this.hCol, this.hCol.querySelector(".sel"), true);
        this._scrollTo(this.mCol, this.mCol.querySelector(".sel"), true);
      } else if (act === "clear") {
        this.value = null; this._render(); this._close(); this.onChange?.(null);
      }
    });

    document.addEventListener("click", () => this._close());
    this.root.addEventListener("click", e => e.stopPropagation());
  }

  _mark() {
    this.hCol.querySelectorAll(".it").forEach(x => x.classList.toggle("sel", +x.dataset.v === this._tmp.h));
    this.mCol.querySelectorAll(".it").forEach(x => x.classList.toggle("sel", +x.dataset.v === this._tmp.m));
  }
  _scrollTo(col, el, instant) {
    if (!el) return;
    const top = el.offsetTop - col.clientHeight / 2 + el.clientHeight / 2;
    col.scrollTo({ top, behavior: instant ? "auto" : "smooth" });
  }
  _close() {
    this.pop.classList.remove("open");
    this.root.classList.remove("open");
  }
  _render() {
    if (!this.value) {
      this.hhEl.textContent = this.opts.optional ? "关" : "--";
      this.mmEl.textContent = this.opts.optional ? "闭" : "--";
    } else {
      const [h, m] = this.value.split(":");
      this.hhEl.textContent = h; this.mmEl.textContent = m;
    }
  }
}

async function loadConfig() {
  const cfg = await api("/api/config");
  $("cfgThreshold").value = cfg.aqi_threshold ?? 100;
  $("cfgInterval").value = cfg.check_interval_min ?? 10;

  const st = cfg.start_time || "19:00";

  tpEnd.set(en || "08:00");

  $("tpEnd").querySelector(".tp-btn").disabled = en == null;

  // 以城市下拉当前值为准 (已含本机定位默认值)
  await loadStations($("citySel").value || cfg.iqair_city_path || "beijing/beijing", cfg.iqair_station);
}

/* ── 城市 / 监测站联动 ── */
function fillCities(sel, list, currentPath) {
  sel.innerHTML = "";
  const groups = {};
  for (const c of list) {
    const g = c.prov || c.group || "其他";
    (groups[g] = groups[g] || []).push(c);
  }
  for (const [g, items] of Object.entries(groups)) {
    const og = document.createElement("optgroup");
    og.label = g;
    for (const c of items) {
      const o = document.createElement("option");
      o.value = c.path; o.textContent = c.name;
      if (c.path === currentPath) o.selected = true;
      og.appendChild(o);
    }
    sel.appendChild(og);
  }
}

let stSeq = 0; // 并发保护: 快速切城市时只应用最后一次请求
async function loadStations(cityPath, pickSlug) {
  const seq = ++stSeq;
  const sel = $("stationSel");
  const hint = $("stHint");
  sel.disabled = true;
  sel.innerHTML = `<option value="">⏳ 监测站加载中…</option>`;
  hint.className = "st-hint busy";
  hint.textContent = "⏳ 正在获取监测站列表，请稍候…";
  try {
    const d = await api(`/api/stations?city_path=${encodeURIComponent(cityPath)}`);
    if (seq !== stSeq) return; // 已被更新的请求取代
    sel.innerHTML = "";
    let matched = false;
    for (const s of d.stations) {
      const o = document.createElement("option");
      o.value = s.slug;
      o.textContent = s.aqi != null ? `${s.name}  AQI ${s.aqi}` : s.name;
      if (pickSlug && s.slug === pickSlug) { o.selected = true; matched = true; }
      sel.appendChild(o);
    }
    if (!pickSlug && d.stations.length) sel.selectedIndex = 0;
    if (pickSlug && !matched && d.stations.length) sel.selectedIndex = 0;
    if (!d.stations.length) sel.innerHTML = `<option value="">(该城市暂无站点)</option>`;
    hint.className = "st-hint";
    hint.textContent = d.stations.length ? `共 ${d.stations.length} 个监测站` : "该城市暂无监测站";
  } catch (e) {
    if (seq !== stSeq) return;
    sel.innerHTML = `<option value="">站点加载失败</option>`;
    hint.className = "st-hint err";
    hint.textContent = "监测站加载失败：" + e.message;
    toast("监测站加载失败：" + e.message);
  } finally {
    if (seq === stSeq) sel.disabled = false;
  }
}

/* ══════════ 状态刷新 ══════════ */
const GRADES = [
  [0, "优", "#30d158"], [51, "良", "#ffd60a"], [101, "轻度污染", "#ff9f0a"],
  [151, "中度污染", "#ff453a"], [201, "重度污染", "#bf5af2"], [301, "严重污染", "#8e3061"],
];
function gradeOf(a) {
  let g = GRADES[0];
  for (const row of GRADES) if (a >= row[0]) g = row;
  return g;
}

async function refreshAQI() {
  try {
    // 携带下拉框当前选中值: 切换监测站后无需保存即可立即看到对应数据
    const cp = $("citySel")?.value || "";
    const st = $("stationSel")?.value || "";
    const qs = `city_path=${encodeURIComponent(cp)}&station=${encodeURIComponent(st)}`;
    const a = await api(`/api/aqi?${qs}`);
    const [lo, name, color] = gradeOf(a.aqi_cn);
    $("aqiBig").textContent = a.aqi_cn;
    $("aqiBig").style.color = color;
    const gEl = $("aqiGrade");
    gEl.textContent = name;
    gEl.style.color = color;
    gEl.style.borderColor = color;
    gEl.style.background = color + "1c";
    $("aqiPm").textContent = a.pm25;
    $("aqiStation").textContent = a.station || "监测站 –";
    $("aqiSource").textContent = a.source || "IQAir";
    $("aqiTime").textContent = a.time ? new Date(a.time).toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Shanghai" }) + " 北京" : "";
    const pos = Math.min(100, (a.aqi_cn / 300) * 100);
    $("scaleMk").style.left = Math.max(2, pos) + "%";
  } catch (e) {
    $("aqiBig").textContent = "–";
    footLog("AQI 获取失败: " + e.message);
  }
}

let lastPower = null;
async function refreshDevice() {
  try {
    const r = await api("/api/status");
    const dev = r.device || {};
    const m = dev.metrics || {};
    const on = !!dev.power;

    const panel = $("devicePanel");
    panel.classList.toggle("is-on", on);
    panel.classList.toggle("is-off", !on);
    $("powerBtn").classList.toggle("on", on);
    $("powerBtnTxt").textContent = on ? "关闭净化器" : "开启净化器";

    const pp = $("pillPower");
    pp.className = "pill " + (on ? "on" : "off");
    $("pillPowerTxt").textContent = on ? "净化器已启动" : "净化器已关闭";

    const speedMap = { 0: "自动", 1: "一档", 2: "二档", 3: "三档", 4: "睡眠" };
    const modeMap = { 0: "自动", 1: "手动", 2: "睡眠", 3: "最爱" };
    $("mSpeed").textContent = speedMap[m.wind_speed] ?? m.wind_speed ?? "–";
    $("mMode").textContent = modeMap[m.work_mode] ?? m.work_mode ?? "–";
    $("mPm").textContent = m.pm25 ?? "–";
    $("mTemp").textContent = m.temperature != null ? m.temperature.toFixed(1) + "°" : "–";
    $("mHum").textContent = m.humidity != null ? m.humidity.toFixed(0) + "%" : "–";
    if (Array.isArray(m.filter_life)) {
      $("mFilter").textContent = Math.min(...m.filter_life.filter(x => x > 0).concat(100)) + "%";
    } else $("mFilter").textContent = "–";

    if (lastPower !== null && lastPower !== on) {
      toast(on ? "净化器已启动" : "净化器已关闭");
    }
    lastPower = on;
  } catch (e) {
    // 保持上一次状态
  }
}

async function togglePower() {
  const on = $("devicePanel").classList.contains("is-on");
  const btn = $("powerBtn");
  const next = !on;
  // ── 立即进入等待态: 告诉用户请求已接收, 云端链路稍慢 ──
  btn.disabled = true;
  btn.classList.add("pending");
  $("powerBtnTxt").textContent = next ? "正在开启…" : "正在关闭…";
  footLog(next ? "已发送开机指令, 等待设备响应…" : "已发送关机指令, 等待设备响应…");
  try {
    await api("/api/power", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ on: next }),
    });
    await refreshDevice();
    toast(next ? "开机指令已送达" : "关机指令已送达");
  } catch (e) {
    toast("控制失败：" + e.message);
    footLog("控制失败: " + e.message);
  } finally {
    btn.classList.remove("pending");
    btn.disabled = false;
    const isOn = $("devicePanel").classList.contains("is-on");
    $("powerBtnTxt").textContent = isOn ? "关闭净化器" : "开启净化器";
  }
}

async function toggleDaemon() {
  const btn = $("daemonBtn");
  const running = btn.dataset.on === "1";
  btn.disabled = true;
  try {
    if (running) {
      await api("/api/auto/stop", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
      toast("自动化已停止");
      footLog("自动化守护停止请求已送达");
    } else {
      await api("/api/auto/start", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
      toast("自动化已启动");
    }
    await pollDaemon();
  } catch (e) {
    toast("操作失败：" + e.message);
  } finally {
    btn.disabled = false;
  }
}

async function pollDaemon() {
  try {
    const d = await api("/api/auto/status");
    const btn = $("daemonBtn");
    btn.dataset.on = d.running ? "1" : "0";
    btn.textContent = d.running ? "停止自动化" : "启动自动化";
    const p = $("pillAuto");
    p.className = "pill " + (d.running ? "run" : "");
    $("pillAutoTxt").textContent = d.running ? "自动化运行中" : "自动化未启动";
    $("pillDaemonTxt").textContent = d.running ? "守护运行中" : "守护未启动";
    $("pillDaemon").className = "pill " + (d.running ? "run" : "");
    if (d.logs && d.logs.length) {
      const last = d.logs[d.logs.length - 1];
      footLog((last.line || JSON.stringify(last)));
    }
  } catch (e) { /* ignore */ }
}

/* ══════════ 启动 ══════════ */
function refreshAll() { refreshAQI(); refreshDevice(); pollDaemon(); }

let dashboardStarted = false;
async function initDashboard() {
  if (dashboardStarted) return;
  dashboardStarted = true;
  try {
    const d = await api("/api/cities");
    cities = d.cities || [];
    const loc = await api("/api/location").catch(() => null);
    const cfg = await api("/api/config");
    // 默认值静默填入: 用户保存过的城市优先, 否则读取本机位置, 兜底北京
    const defaultCity = (cfg.city_explicit && cfg.iqair_city_path)
      ? cfg.iqair_city_path
      : ((loc && loc.city_path) || cfg.iqair_city_path || "beijing/beijing");
    fillCities($("citySel"), cities, defaultCity);
    await loadConfig();
  } catch (e) {
    toast("初始化失败：" + e.message);
  }
  refreshAll();
  setInterval(refreshAQI, 60000);
  setInterval(refreshDevice, 30000);
  setInterval(pollDaemon, 15000);
}

(async function init() {
  // 已登录(本会话) → 直接进入; 否则显示登录门
  if (sessionStorage.getItem("air352_auth") === "1") {
    $("loginGate").classList.add("hidden");
    initDashboard();
  } else {
    $("loginAccount").focus();
  }
})();
</script>
